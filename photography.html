    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 8px;
      }
      #gallery img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 4px;
        cursor: pointer;
        -webkit-user-drag: none;
        user-select: none;
        display: block;
      }
      #lightbox {
        display: none;
        position: fixed;
        z-index: 1000;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.9);
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
        overscroll-behavior: contain;
      }
      body.lightbox-open {
        overflow: hidden;
        position: fixed;
        width: 100%;
      }
      #lightbox.open {
        display: flex;
      }
      #lightbox img {
        max-width: 90%;
        max-height: 80vh;
        -webkit-user-drag: none;
        touch-action: none;
      }
      .lightbox-nav {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 10%;
        min-width: 60px;
        display: flex;
        align-items: center;
        font-size: 2.5em;
        color: rgba(255,255,255,0.7);
        cursor: pointer;
        z-index: 1001;
      }
      .lightbox-nav:hover {
        color: #fff;
      }
      #lightbox-prev {
        left: 0;
        justify-content: flex-start;
        padding-left: 1em;
      }
      #lightbox-next {
        right: 0;
        justify-content: flex-end;
        padding-right: 1em;
      }
    </style>

    <title>Photography | Nabeel Nasir</title>
</head>
<body>

    <img id="lightbox-img" src="" oncontextmenu="return false;"/>

</div>

<!-- generated by photography/process_photos.py -->
<script src="images/photography/manifest.js"></script>
<script>
    // Add filenames here (files live in images/photography/, produced by
    // photography/process_photos.py). Captions are pulled from manifest.js.
    const photos = [
        "IMG_3668.jpg",
        "IMG_3958.jpg",
        "IMG_0577.jpg",
        "IMG_0689.jpg",
        "IMG_0901.jpg",
        "IMG_0108.jpg",
        "IMG_0126.jpg",
        "IMG_0179.jpg",
        "IMG_0298.jpg",
        "IMG_1404.jpg",
        "IMG_0334.jpg",
        "IMG_0429.jpg",
        "IMG_9453.jpg",
        "IMG_9490.jpg",
        "IMG_8401.jpg",
        "IMG_7936.jpg",
        "IMG_7616.jpg",
        "IMG_6056.jpg",
        "IMG_4775.jpg",
        "IMG_2837.jpg",
        "IMG_9234.jpg",
        "IMG_9398.jpg",
        "IMG_9520.jpg",
        "IMG_7116.jpg",
        "IMG_7119.jpg",
        "IMG_5650.jpg",
        "IMG_2746.jpg",
        "IMG_0702.jpg",
        "IMG_0715.jpg",
        "IMG_9191.jpg",
        "IMG_8290.jpg",
        "IMG_7239.jpg",
        "IMG_7772.jpg",
        "IMG_6570.jpg",
        "IMG_4907.jpg",
        "IMG_0040.jpg",
        "IMG_20190703_122935_Original.jpg",
    ];

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const lightboxPrev = document.getElementById("lightbox-prev");
    const lightboxNext = document.getElementById("lightbox-next");

    let currentIndex = -1;
    let scrollY = 0;

    function captionFor(filename) {
        const meta = (typeof photoManifest !== "undefined") && photoManifest[filename];
        if (!meta) return "";
        const when = [meta.month, meta.year].filter(Boolean).join(" ");
        return [when, meta.location].filter(Boolean).join(" — ");
    }

    function showAt(index) {
        const wasOpen = lightbox.classList.contains("open");
        currentIndex = (index + photos.length) % photos.length;
        const filename = photos[currentIndex];
        lightboxImg.src = "images/photography/" + filename;
        lightboxCaption.textContent = captionFor(filename);

        if (!wasOpen) {
            scrollY = window.scrollY;
            document.body.style.top = -scrollY + "px";
            document.body.classList.add("lightbox-open");
            lightbox.classList.add("open");
        }
    }

    function closeLightbox() {
        lightbox.classList.remove("open");
        lightboxImg.src = "";
        currentIndex = -1;
        document.body.classList.remove("lightbox-open");
        document.body.style.top = "";
        window.scrollTo(0, scrollY);
    }

    photos.forEach(function (filename, index) {
        const img = document.createElement("img");
        img.src = "images/photography/" + filename;
        img.loading = "lazy";
        img.oncontextmenu = function () { return false; };
        img.addEventListener("click", function () {
            showAt(index);
        });

        gallery.appendChild(img);
    });

    lightbox.addEventListener("click", closeLightbox);

    lightboxPrev.addEventListener("click", function (e) {
        e.stopPropagation();
        showAt(currentIndex - 1);
    });

    lightboxNext.addEventListener("click", function (e) {
        e.stopPropagation();
        showAt(currentIndex + 1);
    });

    document.addEventListener("keydown", function (e) {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "ArrowLeft") showAt(currentIndex - 1);
        else if (e.key === "ArrowRight") showAt(currentIndex + 1);
        else if (e.key === "Escape") closeLightbox();
    });

    const SWIPE_THRESHOLD = 40;
    const TAP_THRESHOLD = 10;
    let touchStartX = null;
    let touchStartY = null;

    lightbox.addEventListener("touchstart", function (e) {
        if (e.touches.length !== 1 || e.target.closest(".lightbox-nav")) {
            touchStartX = null;
            return;
        }
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener("touchend", function (e) {
        if (touchStartX === null) return;
        const touch = e.changedTouches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;

        if (Math.abs(deltaX) > SWIPE_THRESHOLD && Math.abs(deltaX) > Math.abs(deltaY)) {
            // horizontal swipe: navigate, and swallow the follow-up
            // synthetic click so it doesn't also close the lightbox
            e.preventDefault();
            if (deltaX < 0) showAt(currentIndex + 1);
            else showAt(currentIndex - 1);
        } else if (Math.abs(deltaX) < TAP_THRESHOLD && Math.abs(deltaY) < TAP_THRESHOLD) {
            // tap: close directly instead of relying on the synthetic click,
            // which iOS Safari doesn't reliably fire after touch handling
            e.preventDefault();
            closeLightbox();
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

</script>
